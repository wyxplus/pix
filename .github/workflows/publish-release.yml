name: Publish release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Auto keeps an unreleased source version, otherwise increments patch
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Optional exact stable version, e.g. 0.8.0 (overrides bump)
        type: string
        default: ""
concurrency:
  group: publish-release-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  version:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Commit the next version and tag it atomically
        id: version
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "main changed during validation. Run Publish release again to test and release the newer commit." >&2
            exit 1
          fi
          version=$(node scripts/next-version.mjs)
          node scripts/set-version.mjs "$version"
          node scripts/release-assets.mjs check-version "v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$version"
          fi
          git tag -a "v$version" -m "Pix v$version"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Prepared **v$version**. The Release jobs will build all four platforms and publish the installers." >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
